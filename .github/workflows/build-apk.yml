name: Build FunX APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'FunX current HTTPS API origin (no trailing slash)'
        required: true
        type: string
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Inject current FunX server address
        env:
          FUNX_SERVER_URL: ${{ inputs.server_url || vars.FUNX_SERVER_URL }}
        run: python3 tools/prepare-client.py
      - name: Restore stable APK signing key
        env:
          FUNX_KEYSTORE_B64: ${{ secrets.FUNX_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$FUNX_KEYSTORE_B64" ]; then
            printf '%s' "$FUNX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/funx-upload.p12"
            chmod 600 "$RUNNER_TEMP/funx-upload.p12"
            echo "FUNX_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/funx-upload.p12" >> "$GITHUB_ENV"
          fi
      - name: Assemble debug APK
        env:
          FUNX_SIGNING_PASSWORD: ${{ secrets.FUNX_SIGNING_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FunX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check that the live API is reachable before publishing an installable release
        id: live_backend
        env:
          FUNX_SERVER_URL: ${{ inputs.server_url || vars.FUNX_SERVER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS --max-time 12 "${FUNX_SERVER_URL}/health" | grep -q '"service":"FunX"'; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
            echo 'FunX backend health verified.'
          else
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
            echo 'FunX backend is unavailable; APK is kept as a build artifact, not published as a working release.'
          fi
      - name: Publish FunX v4.2.1 direct APK download
        if: github.ref == 'refs/heads/main' && steps.live_backend.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk FunX-v4.2.1.apk
          unzip -t FunX-v4.2.1.apk | grep -q 'No errors detected'
          if gh release view v4.2.1 -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v4.2.1 FunX-v4.2.1.apk --clobber -R "${GITHUB_REPOSITORY}"
          else
            gh release create v4.2.1 FunX-v4.2.1.apk -R "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "FunX v4.2.1" --notes "Keyboard-safe chat scroll, typing preview that retains messages, unread inbox highlighting, persistent 20-minute rewards in three Dhaka time windows. Backend must run same version. Withdrawals are manual."
          fi
