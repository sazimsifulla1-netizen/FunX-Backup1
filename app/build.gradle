plugins { id 'com.android.application' }

android {
    namespace 'com.sazimcodex.funx'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sazimcodex.funx'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '4.1.1'
    }

    signingConfigs {
        funxStable {
            storeFile file(System.getenv('FUNX_SIGNING_KEYSTORE_PATH') ?: '/tmp/funx-signing-not-configured.p12')
            storePassword System.getenv('FUNX_SIGNING_PASSWORD') ?: ''
            keyAlias 'funx-upload'
            keyPassword System.getenv('FUNX_SIGNING_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            if (System.getenv('FUNX_SIGNING_KEYSTORE_PATH') && System.getenv('FUNX_SIGNING_PASSWORD')) {
                signingConfig signingConfigs.funxStable
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
